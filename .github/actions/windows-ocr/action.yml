name: Bundle Windows OCR
description: Install verified UCRT64 packages and stage the OCR runtime and language data

runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-binutils
          mingw-w64-ucrt-x86_64-qpdf
          mingw-w64-ucrt-x86_64-tesseract-ocr
          mingw-w64-ucrt-x86_64-tesseract-data-eng
          mingw-w64-ucrt-x86_64-tesseract-data-ara
    - name: Stage OCR providers
      shell: msys2 {0}
      run: bash scripts/bundle_windows_ocr.sh dist
