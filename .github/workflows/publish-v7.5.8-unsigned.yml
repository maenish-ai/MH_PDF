name: Publish MaenPDF v7.5.8 unsigned exception

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v7.5.8-unsigned.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v7.5.8
  cancel-in-progress: false

env:
  SOURCE_RUN: '45580688330'
  RELEASE_SHA: '5acf4df8e3d52ed2e603b15b1cdc70ac05b2a7e3'
  RELEASE_TAG: v7.5.8
  ASSET: MaenPDF-7.5.8-Setup.exe

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Verify source CI run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or
              $run.head_sha -ne $env:RELEASE_SHA -or $run.path -ne '.github/workflows/ci.yml') {
              throw 'The installer source must be the exact successful MaenPDF CI run.'
          }

      - name: Download the tested installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: MaenPDF-Windows-Setup
          path: release-assets

      - name: Verify, publish and check the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = 'release-assets/MaenPDF-Setup.exe'
          $version = (Get-Item $installer).VersionInfo.ProductVersion.Trim()
          if ($version -ne $env:RELEASE_TAG.Substring(1)) {
              throw "Unexpected installer version $version."
          }
          $asset = Join-Path 'release-assets' $env:ASSET
          Move-Item -LiteralPath $installer -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$env:ASSET" | Set-Content -Encoding ascii release-assets/SHA256SUMS.txt

          gh release create $env:RELEASE_TAG $asset release-assets/SHA256SUMS.txt `
              --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_SHA `
              --title 'MaenPDF v7.5.8' --latest `
              --notes 'Windows now includes offline Arabic and English OCR for searchable PDFs. This Windows installer is unsigned and may show a SmartScreen warning.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          $latestAsset = $latest.assets | Where-Object name -eq $env:ASSET
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne $env:RELEASE_TAG -or
              $latestAsset.digest -ne "sha256:$hash") {
              throw 'The latest release or its installer digest did not match the verified build.'
          }
