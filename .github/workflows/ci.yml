name: MaenPDF CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maenpdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.2'
  ANDROID_API: '36'
  ANDROID_MIN_API: '28'
  ANDROID_NDK: '27.2.12479018'

jobs:
  source-audit:
    name: Source, localization and release audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Run release gates
        run: |
          python tests/source_audit.py
          python tests/localization_audit.py
          python tests/release_audit.py
          python tests/engine_v6_audit.py
          python -m compileall -q tests

  windows-modern:
    name: Windows 10/11 x64
    needs: source-audit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install current aqtinstall extension support
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git"
      - name: Install Qt 6.11.2 + QtPdf extension
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt" -m qtpdf
          $qtRoot = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify QtPdf installation
        shell: pwsh
        run: |
          if (!(Test-Path "$env:QT_ROOT_DIR\lib\cmake\Qt6Pdf\Qt6PdfConfig.cmake")) { throw "QtPdf extension was not installed" }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy complete Qt + VC143 runtime
        shell: pwsh
        run: |
          ./scripts/deploy_windows.ps1 `
            -QtRootDir "$env:QT_ROOT_DIR" `
            -BuildExe "build/Release/MaenPDF.exe" `
            -DistDir "dist"

      - name: Smoke test portable MaenPDF with native Windows platform
        shell: pwsh
        run: |
          # Do NOT set QT_QPA_PLATFORM=offscreen here. This must exercise
          # qwindows.dll and the same startup path used on a real Windows PC.
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
          $log = Join-Path $env:LOCALAPPDATA "MaenPDF\MaenPDF\logs\maenpdf.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "$PWD\dist\MaenPDF.exe" -WorkingDirectory "$PWD\dist" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            if (Test-Path $log) { Get-Content $log -Tail 150 | Write-Host }
            throw "MaenPDF.exe exited during native Windows startup smoke test with code $($proc.ExitCode)"
          }
          if (!(Test-Path $log)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "MaenPDF startup log was not created"
          }
          $logText = Get-Content $log -Raw
          $logText | Write-Host
          if ($logText -notmatch "Main window created successfully") {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "MaenPDF process started but the main QML window was not confirmed"
          }
          Stop-Process -Id $proc.Id -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw "Inno Setup compiler not found" }
            $iscc = $cmd.Source
          }
          & $iscc "installer\MaenPDF.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer-output\MaenPDF-Setup.exe")) { throw "MaenPDF-Setup.exe was not produced" }

      - name: Smoke test installed MaenPDF from desktop shortcut
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer-output\MaenPDF-Setup.exe").Path
          $installDir = "$env:RUNNER_TEMP\MaenPDF-Smoke"
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir",'/TASKS=desktopicon')
          $installer = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "MaenPDF installer smoke test failed with code $($installer.ExitCode)" }

          $installedExe = Join-Path $installDir 'MaenPDF.exe'
          if (!(Test-Path $installedExe)) { throw "Installed MaenPDF.exe is missing" }
          if (!(Test-Path (Join-Path $installDir 'platforms\qwindows.dll'))) { throw "Installed qwindows.dll is missing" }
          if (!(Test-Path (Join-Path $installDir 'Qt6Pdf.dll'))) { throw "Installed Qt6Pdf.dll is missing" }
          if (!(Test-Path (Join-Path $installDir 'msvcp140.dll'))) { throw "Installed MSVC runtime is missing" }

          $desktopCandidates = @(
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'MaenPDF.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'MaenPDF.lnk')
          )
          $shortcut = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $shortcut) {
            throw "MaenPDF desktop shortcut was not created"
          }

          $wsh = New-Object -ComObject WScript.Shell
          $link = $wsh.CreateShortcut($shortcut)
          if ([IO.Path]::GetFullPath($link.TargetPath) -ne [IO.Path]::GetFullPath($installedExe)) {
            throw "Desktop shortcut target is wrong: $($link.TargetPath)"
          }
          if ([IO.Path]::GetFullPath($link.WorkingDirectory) -ne [IO.Path]::GetFullPath($installDir)) {
            throw "Desktop shortcut working directory is wrong: $($link.WorkingDirectory)"
          }

          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
          $log = Join-Path $env:LOCALAPPDATA "MaenPDF\MaenPDF\logs\maenpdf.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $shortcut
          Start-Sleep -Seconds 8
          $proc = Get-Process -Name MaenPDF -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $proc) {
            if (Test-Path $log) { Get-Content $log -Tail 150 | Write-Host }
            throw "MaenPDF did not remain running when launched from the desktop shortcut"
          }
          if (!(Test-Path $log)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Installed MaenPDF did not create its startup log"
          }
          $logText = Get-Content $log -Raw
          $logText | Write-Host
          if ($logText -notmatch "Main window created successfully") {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Desktop shortcut launched a process but the main QML window was not confirmed"
          }
          Stop-Process -Id $proc.Id -Force

      - name: Collect Windows diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-diagnostics | Out-Null
          if (Test-Path "dist\windows-runtime-inventory.txt") {
            Copy-Item "dist\windows-runtime-inventory.txt" windows-diagnostics/ -Force
          }
          $log = Join-Path $env:LOCALAPPDATA "MaenPDF\MaenPDF\logs\maenpdf.log"
          if (Test-Path $log) { Copy-Item $log "windows-diagnostics\maenpdf.log" -Force }
          if (Test-Path "build\CMakeCache.txt") { Copy-Item "build\CMakeCache.txt" windows-diagnostics/ -Force }

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: MaenPDF-Windows-Diagnostics
          path: windows-diagnostics/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MaenPDF-Windows-Setup
          path: installer-output/MaenPDF-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MaenPDF-Windows-Portable
          path: dist/
          if-no-files-found: error

  android-play:
    name: Android APK/AAB (ARM64 + ARMv7)
    needs: source-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;36.0.0" "ndk;${ANDROID_NDK}"
      - name: Install current aqtinstall extension support
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git"
      - name: Install Qt Android ARM64 + QtPdf
        shell: bash
        run: |
          python -m aqt install-qt all_os android "${QT_VERSION}" android_arm64_v8a \
            -O "$RUNNER_TEMP/Qt" -m qtpdf --autodesktop
      - name: Install Qt Android ARMv7 + QtPdf
        shell: bash
        run: |
          python -m aqt install-qt all_os android "${QT_VERSION}" android_armv7 \
            -O "$RUNNER_TEMP/Qt" -m qtpdf
      - name: Verify Qt host and Android installations
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/Qt/${QT_VERSION}/gcc_64/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6Pdf/Qt6PdfConfig.cmake"
          test -f "$RUNNER_TEMP/Qt/${QT_VERSION}/android_armv7/lib/cmake/Qt6Pdf/Qt6PdfConfig.cmake"
      - name: Create ephemeral CI test signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/maenpdf-ci-test.jks" \
            -storepass maenpdf-ci-test \
            -alias maenpdf-ci-test \
            -keypass maenpdf-ci-test \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=MaenPDF CI Test, OU=Development, O=MaenPDF, L=Amman, ST=Amman, C=JO"

      - name: Configure Android multi-ABI with installable test APK signing
        shell: bash
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/maenpdf-ci-test.jks
          QT_ANDROID_KEYSTORE_ALIAS: maenpdf-ci-test
          QT_ANDROID_KEYSTORE_STORE_PASS: maenpdf-ci-test
          QT_ANDROID_KEYSTORE_KEY_PASS: maenpdf-ci-test
        run: |
          "$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a/bin/qt-cmake" \
            -S . -B build-android -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-${ANDROID_MIN_API} \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" \
            -DQT_HOST_PATH="$RUNNER_TEMP/Qt/${QT_VERSION}/gcc_64" \
            -DQT_ANDROID_BUILD_ALL_ABIS=TRUE \
            -DQT_ANDROID_SIGN_APK=ON

      - name: Build signed test APK
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/maenpdf-ci-test.jks
          QT_ANDROID_KEYSTORE_ALIAS: maenpdf-ci-test
          QT_ANDROID_KEYSTORE_STORE_PASS: maenpdf-ci-test
          QT_ANDROID_KEYSTORE_KEY_PASS: maenpdf-ci-test
        run: cmake --build build-android --target apk --parallel

      # Qt's AAB target may regenerate the Android output directory and replace
      # the previously signed APK with an unsigned intermediate. Preserve the
      # verified installable APK before invoking the AAB target.
      - name: Verify and preserve signed test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-android

          signed_apk="$(find build-android -type f -name '*-signed.apk' -print -quit)"
          if [ -z "$signed_apk" ]; then
            echo "The signed APK output was not produced." >&2
            find build-android -type f -name '*.apk' -print >&2
            exit 1
          fi

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed_apk"
          cp -v "$signed_apk" dist-android/MaenPDF-Installable-Test.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dist-android/MaenPDF-Installable-Test.apk

      - name: Build AAB for validation
        run: cmake --build build-android --target aab --parallel

      - name: Collect AAB validation artifact
        shell: bash
        run: |
          set -euo pipefail
          aab="$(find build-android -type f -name '*.aab' -print -quit)"
          if [ -z "$aab" ]; then
            echo "AAB was not produced." >&2
            exit 1
          fi
          cp -v "$aab" dist-android/MaenPDF-For-Play-Validation.aab

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: MaenPDF-Android-Installable-Test
          path: dist-android/
          if-no-files-found: error
