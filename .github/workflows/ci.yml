name: Orbis PDF CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.11.2'
  ANDROID_API: '36'
  ANDROID_MIN_API: '28'
  ANDROID_NDK: '27.2.12479018'

jobs:
  source-audit:
    name: Source, localization and release audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release gates
        run: |
          python tests/source_audit.py
          python tests/localization_audit.py
          python tests/release_audit.py
          python tests/engine_v6_audit.py
          python -m compileall -q tests

  windows-modern:
    name: Windows 10/11 x64
    needs: source-audit
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current aqtinstall extension support
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git"
      - name: Install Qt 6.11.2 + QtPdf extension
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt" -m qtpdf
          $qtRoot = "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64"
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify QtPdf installation
        shell: pwsh
        run: |
          if (!(Test-Path "$env:QT_ROOT_DIR\lib\cmake\Qt6Pdf\Qt6PdfConfig.cmake")) { throw "QtPdf extension was not installed" }
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/OrbisPDF.exe dist/
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir ui --no-translations dist/OrbisPDF.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OrbisPDF-Windows10-11-x64
          path: dist/
          if-no-files-found: error

  android-play:
    name: Android APK/AAB (ARM64 + ARMv7)
    needs: source-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;36.0.0" "ndk;${ANDROID_NDK}"
      - name: Install current aqtinstall extension support
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git"
      - name: Install Qt Android ARM64 + QtPdf
        shell: bash
        run: |
          python -m aqt install-qt all_os android "${QT_VERSION}" android_arm64_v8a \
            -O "$RUNNER_TEMP/Qt" -m qtpdf --autodesktop
      - name: Install Qt Android ARMv7 + QtPdf
        shell: bash
        run: |
          python -m aqt install-qt all_os android "${QT_VERSION}" android_armv7 \
            -O "$RUNNER_TEMP/Qt" -m qtpdf
      - name: Verify QtPdf Android installations
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6Pdf/Qt6PdfConfig.cmake"
          test -f "$RUNNER_TEMP/Qt/${QT_VERSION}/android_armv7/lib/cmake/Qt6Pdf/Qt6PdfConfig.cmake"
      - name: Configure Android multi-ABI
        shell: bash
        run: |
          "$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a/bin/qt-cmake" \
            -S . -B build-android -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-${ANDROID_MIN_API} \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=TRUE
      - name: Build APK
        run: cmake --build build-android --target apk --parallel
      - name: Build AAB
        run: cmake --build build-android --target aab --parallel
      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p dist-android
          find build-android -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp -v {} dist-android/ \;
          test -n "$(find dist-android -type f -name '*.apk' -print -quit)"
          test -n "$(find dist-android -type f -name '*.aab' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: OrbisPDF-Android-unsigned
          path: dist-android/
          if-no-files-found: error
